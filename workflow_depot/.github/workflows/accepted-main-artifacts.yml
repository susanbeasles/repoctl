name: Consume accepted integration artifact without rebuilding
on:
  workflow_call:
    inputs:
      depot_ref: {type: string, required: true}
      integration_depot_ref: {type: string, required: true}
      integration_run_id: {type: string, required: true}
      promotion_evidence_artifact: {type: string, required: true}
      worker_artifact_path: {type: string, required: true}
      target: {type: string, required: true}
permissions: {}
jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read, actions: read}
    steps:
      - name: Validate immutable consumer and producer revisions
        env:
          DEPOT_REF: ${{ inputs.depot_ref }}
          PRODUCER_REF: ${{ inputs.integration_depot_ref }}
          ARTIFACT_PATH: ${{ inputs.worker_artifact_path }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import os,re
          for name in ['DEPOT_REF','PRODUCER_REF']:assert re.fullmatch('[a-f0-9]{40}',os.environ[name])
          assert re.fullmatch('[a-z0-9-]+',os.environ['TARGET'])
          path=os.environ['ARTIFACT_PATH'];assert re.fullmatch(r'[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*',path) and all(x not in ['.','..'] for x in path.split('/'))
          assert os.environ['PRIVATE_REPOSITORY']=='true'
          assert os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/heads/main'
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: susanbeasles/workflow_depot
          ref: ${{ inputs.depot_ref }}
          path: .deployment-depot
          persist-credentials: false
      - id: source
        name: Verify current main and exact successful integration run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_RUN_ID: ${{ inputs.integration_run_id }}
        run: node .deployment-depot/ci/main-source-run.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: integration-release-${{ github.sha }}
          run-id: ${{ inputs.integration_run_id }}
          github-token: ${{ github.token }}
          path: signed-release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Verify the exact OIDC producer identity before extraction
        env:
          PRODUCER_REF: ${{ inputs.integration_depot_ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/susanbeasles/workflow_depot/.github/workflows/integration-quality.yml@$PRODUCER_REF"
          for file in integration-release.tar.gz artifact-provenance.json; do
            cosign verify-blob --bundle "signed-release/$file.sigstore.json" --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "signed-release/$file"
          done
          python3 .deployment-depot/ci/unpack-release.py signed-release accepted-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.promotion_evidence_artifact }}
          run-id: ${{ inputs.integration_run_id }}
          github-token: ${{ github.token }}
          path: promotion-evidence
      - name: Package retained owner/App evidence and original Worker bytes for central verification
        env:
          ARTIFACT_PATH: ${{ inputs.worker_artifact_path }}
        run: |
          node .deployment-depot/capabilities/deploy/package-bundle.mjs "accepted-release/payload/$ARTIFACT_PATH" promotion-evidence/signing-receipt.json promotion-evidence/approval-payload.json promotion-evidence/owner-approval.json promotion-evidence/provenance.json deployment-bundle.json
      - name: Recheck current main immediately before publishing the envelope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_RUN_ID: ${{ inputs.integration_run_id }}
        run: node .deployment-depot/ci/main-source-run.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deployment-${{ github.sha }}-${{ inputs.target }}
          path: deployment-bundle.json
          if-no-files-found: error
          retention-days: 30
