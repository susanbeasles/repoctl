name: Detect ecosystems
description: Detects languages, package managers, IaC and artifact types from the git-tracked tree. Drives applicability of every other control. Emits SRC-ECOSYSTEM-DETECT.
inputs:
  source_path: { description: Path to the candidate checkout, required: true }
outputs:
  matrix: { value: "${{ steps.detect.outputs.matrix }}" }
  codeql_languages: { value: "${{ steps.detect.outputs.codeql_languages }}" }
  has_shell: { value: "${{ steps.detect.outputs.has_shell }}" }
  has_node: { value: "${{ steps.detect.outputs.has_node }}" }
  has_python: { value: "${{ steps.detect.outputs.has_python }}" }
  has_rust: { value: "${{ steps.detect.outputs.has_rust }}" }
  has_swift: { value: "${{ steps.detect.outputs.has_swift }}" }
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        set -euo pipefail; S="${{ github.action_path }}/../../scripts"; st() { if [ "$1" = ERR ]; then echo TOOL_FAILURE; elif [ "$1" -gt 0 ]; then echo FAIL; else echo PASS; fi; }; mkdir -p "$RESULTS_DIR/evidence"
        python3 "$S/detect_ecosystems.py" --repo "${{ inputs.source_path }}" --out "$RESULTS_DIR/evidence/ecosystems.detected.json"
        python3 "$S/result.py" --control SRC-ECOSYSTEM-DETECT --domain meta --status PASS --tool detect-ecosystems --tool-version 2 \
          --coverage "$(python3 -c "import json;d=json.load(open('$RESULTS_DIR/ecosystems.detected.json'));print(d['summary'])")" --evidence "$RESULTS_DIR/evidence/ecosystems.detected.json"
