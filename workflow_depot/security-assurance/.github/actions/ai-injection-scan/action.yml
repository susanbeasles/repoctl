name: AI instruction-poisoning scan
description: Scans agent-readable files (AGENTS.md, CLAUDE.md, .cursorrules, README, docs, MCP configs, skills) for hidden-instruction and exfiltration patterns. Hard indicators block; phrase heuristics report. Emits AI-INJECTION.
inputs:
  source_path: { description: Candidate checkout, required: true }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set +e; T0=$SECONDS; S="${{ github.action_path }}/../../scripts"; st() { if [ "$1" = ERR ]; then echo TOOL_FAILURE; elif [ "$1" -gt 0 ]; then echo FAIL; else echo PASS; fi; }; E="$RESULTS_DIR/evidence"; mkdir -p "$E"
        timeout 600 python3 "$S/ai_injection_scan.py" --root "${{ inputs.source_path }}" --out "$E/ai-injection.findings.json"; RC=$?
        [ $RC -ne 0 ] && { python3 "$S/result.py" --control AI-INJECTION --domain Q --status TOOL_FAILURE --reason "scanner exit $RC" --tool ai-injection-scan --tool-version 1; exit 0; }
        N=$(python3 "$S/count_blocking.py" "$E/ai-injection.findings.json")
        python3 "$S/result.py" --control AI-INJECTION --domain Q --status $(st "$N") --reason "$N hard indicators" \
          --tool ai-injection-scan --tool-version 1 --confidence heuristic --findings-json "$E/ai-injection.findings.json" --evidence "$E/ai-injection.findings.json" --duration-s $((SECONDS-T0))
