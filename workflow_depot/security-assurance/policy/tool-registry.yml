# Python-distributed tools. Version-pinned; NOT hash-pinned yet (pip --require-hashes
# needs a full transitive hash set generated with `uv pip compile --generate-hashes`).
# This is recorded as coverage gap GAP-TOOL-PYHASH in docs/coverage-matrix.md.
python_tools:
  semgrep: "1.180.0"
  hypothesis: "6.169.0"
  checkov: "3.3.28"
  bandit: "1.9.4"
  pip-audit: "2.10.1"
  schemathesis: "4.31.0"

# Actions used by the reusable workflow, pinned to full commit SHAs
# (tag shown for humans; the SHA is what runs).
actions:
  actions/checkout: { tag: v7.0.1, sha: 3d3c42e5aac5ba805825da76410c181273ba90b1 }
  actions/upload-artifact: { tag: v7.0.2, sha: cf430e030ddbb5b0abf93d22962f4752f3646cd9 }
  actions/download-artifact: { tag: v8.0.2, sha: 9000827ccba6bdab643e8b6fd33ac0654aef8333 }
  actions/setup-python: { tag: v7.0.0, sha: 5fda3b95a4ea91299a34e894583c3862153e4b97 }
  actions/setup-node: { tag: v7.1.0, sha: 949feb2413d6458794dcd2491c4babbbce0c15c1 }
  # eslint toolchain installed by the depot (pinned exact versions, --ignore-scripts) and mounted read-only into the sandbox
node_tools:
  eslint: "10.12.0"
  eslint-plugin-security: "4.2.0"
  "@eslint/js": "10.0.1"
  github/codeql-action: { tag: v4.38.3, sha: 24c54180a607b1449ed407dd24f251e4e9147c8d }
  sigstore/cosign-installer: { tag: v4.1.2, sha: 6f9f17788090df1f26f669e9d70d6ae9567deba6 }
  zaproxy/action-baseline: { tag: v0.15.0, sha: de8ad967d3548d44ef623df22cf95c3b0baf8b25 }

# Not yet qualified (no pinned digest, no fixture). Listed so the gap is explicit.
unqualified:
  mobsf: "requires dedicated host; not provisioned"
  nuclei: "template supply chain needs review/pinning before use as a gate"
  clamav: "installed from Ubuntu apt (distro-signed); version recorded at runtime, not pinned here"
