# Tool qualification registry.
#
# Every binary tool the pipeline runs is listed here with an exact version and the
# SHA-256 of the exact release asset. install_tool.py refuses to install anything
# whose digest does not match (fail closed). Digests were computed by downloading
# each asset and cross-checked against the upstream *_checksums.txt file where the
# project publishes one (noted per tool). Re-verify when bumping a version.
#
# Fields: version, url, sha256, archive (tar.gz|tar.xz|binary), binary (path inside
# archive), upstream_checksums (url of the project's checksum file, if any),
# signing (how the project signs releases; verification step is noted in
# install_tool.py and is a TODO where not yet wired), capabilities, blind_spots.

schema_version: 1
registry_updated: "2026-10-12"  # v3: cargo-audit, cargo-deny, swiftlint, cosign added

