name: Central deployment admission
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repository:
        description: Exact source owner/repository
        required: true
        type: string
      repository_id:
        description: Immutable source repository ID
        required: true
        type: string
      sha:
        description: Signed current-main commit (40 hexadecimal characters)
        required: true
        type: string
      source_run_id:
        description: Successful main deployment-caller run
        required: true
        type: string
      target:
        description: Exact target from deployment/services.json
        required: true
        type: string
permissions: {}
concurrency:
  group: central-deployment-admission
  cancel-in-progress: false
jobs:
  admit:
    if: github.repository == 'susanbeasles/delivery_control' && github.repository_id == '1405415291' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      state: ${{ steps.admit.outputs.state }}
      target: ${{ steps.admit.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test test/deployments.test.mjs
      - id: preflight
        run: node src/deployments.mjs preflight
        env:
          DEPLOY_REQUEST_JSON: ${{ toJSON(inputs) }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: source-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: susanbeasles
          repositories: ${{ steps.preflight.outputs.repository_name }}
          permission-contents: read
          permission-actions: read
      - id: admit
        run: node src/deployments.mjs admit
        env:
          GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
          DEPLOY_REQUEST_JSON: ${{ toJSON(inputs) }}
  deploy:
    needs: admit
    if: needs.admit.outputs.state != 'source-only'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/deployment-job.yml
    with:
      request: ${{ toJSON(inputs) }}
    secrets: inherit
